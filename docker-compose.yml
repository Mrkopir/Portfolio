services:
  frontend:
    build:
      context: ./client_next
      dockerfile: Dockerfile
    container_name: Portfolio_front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://chetvertynivskyi.com
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: Portfolio_back
    env_file:
      - ./server/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: Portfolio_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/application_log/nginx:/var/log/nginx
      - ./nginx/certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./nginx/main_conf_file.conf:/etc/nginx/nginx.conf
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot
    container_name: portfolio_certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
