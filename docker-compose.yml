services:
  frontend:
    build:
      context: ./client_next
      dockerfile: Dockerfile
    container_name: Portfolio_front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://chetvertynivskyi.com
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: Portfolio_back
    env_file: 
      - ./server/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
  
  nginx:
    image: nginx:alpine
    container_name: Portfolio_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: portfolio_certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

